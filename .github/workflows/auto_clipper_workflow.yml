name: AutoClipper Serverless Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Source Video URL or Stickman Topic Prompt'
        required: true
        default: 'Why do we dream?'
      max_clips:
        description: 'Max Shorts to create (1-5)'
        required: false
        default: '3'
      caption_theme:
        description: 'Caption Theme (submagic / bold_white / neon_cyan)'
        required: false
        default: 'submagic'

  repository_dispatch:
    types: [make_short]

  issues:
    types: [opened, labeled]

jobs:
  clip-and-post:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      contains(github.event.issue.labels.*.name, 'make-short') ||
      github.event_name == 'issues'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r worker/requirements.txt

      - name: Run AutoClipper Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          ANYTHING_API_KEY: ${{ secrets.ANYTHING_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_OAUTH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TEXT="${{ github.event.inputs.video_url }}"
            CLIPS="${{ github.event.inputs.max_clips }}"
            THEME="${{ github.event.inputs.caption_theme }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT_TEXT="${{ github.event.client_payload.video_url }}"
            CLIPS="${{ github.event.client_payload.max_clips }}"
            THEME="${{ github.event.client_payload.caption_theme }}"
          else
            INPUT_TEXT="${{ github.event.issue.body }}"
            CLIPS="3"
            THEME="submagic"
          fi

          echo "==============================================="
          echo "Processing Video Short Pipeline for: $INPUT_TEXT"
          echo "Clips Count: $CLIPS | Theme: $THEME"
          echo "==============================================="

          # Check if input is a URL or a topic prompt for Stickman generator
          if [[ "$INPUT_TEXT" =~ ^https?:// ]]; then
            python worker/main.py --url "$INPUT_TEXT" --clips "$CLIPS" --theme "$THEME"
          else
            python worker/main.py --stickman --topic "$INPUT_TEXT" --theme "$THEME"
          fi

      - name: Post Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🎉 **AutoClipper Complete!** Your video has been rendered and automatically submitted to YouTube Shorts, TikTok, and Instagram Reels."
            })
